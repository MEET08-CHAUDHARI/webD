<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="homework.css" />
  </head>

  <body>
    <center>
    <center>
      
        <div id="my"><h1>TechConf</h1>
          <nav>
            <ul>
          <nav class="nav-links">
            <a >Home</a>
            <a >Speakers</a>
            <a >Schedule</a>
            <a ><button>REGISTER</button></a>
            </ul>
          </nav>
        </div>
     </center>

    
      <center>
        <h4 id="a">REGISTER NOW</h4>
        <h1>Conference Registration</h1>
          <p>
            Fill in the details below to secure your spot at Tech Conference
            2026.
          </p>
        </center>
   
      <fieldset >
        
          <h3 id="a">Personal Information</h3>
          <label for="one">Name:</label>
          <input type="text" name="one" placeholder="Enter your name" />
          <br />
          <br />
          <label for="two">Email:</label>
          <input type="email" name="two" placeholder="Enter your Email" />
          <br />
          <br />
          <label for="three">Phone:</label>
          <input
            type="number"
            name="three"
            placeholder="Enter your content No."
          />
          <br />
          <br />
          <label for="four">Date of Birth </label>
          <input type="date" id="four"/>
          <br />
          <br />
          <label>Gender:</label>
          <br />
          <label>Male</label>
          <input type="radio" name="gender" />
          <label>Female</label>
          <input type="radio" name="gender" />
          <label>Other</label>
          <input type="radio" name="gender" />
        
      </fieldset>
  
      <fieldset >
       
          <h3 id="a">Account Information</h3>
          <label for="one">Username:</label>
          <input type="text" id="one" placeholder=" Choose a Username" />
          <br />
          <br />
          <label for="two">Password:</label>
          <input
            type="password"
            id="two"
            placeholder="Enter your password" />
          <br />
          <br />
          <label for="three">Confirm Password:</label>
          <input
            type="Password"
            id="three"
            placeholder="Enter your password"  />
      </fieldset>
      <br>
      <fieldset >
        <h3 id="a">Conference Preferences</h3>
        <label>Ticket Type:</label>
        <br />
        <label> Student</label>
        <input type="radio" name="Ticket Type"  value="Student"/>
        <label>Professional</label>
        <input type="radio" name="Ticket Type" value="Professional"/>
        <label>VIP</label>
        <input type="radio" name="Ticket Type"  value="VIP"/>
        <br/>
        <br/>
        <label>Areas of Interest</label>
        <br />
        <label>AI</label>
        <input name="Areas of Interest" type="checkbox" value="AI" />
        <br />
        <label>Web Development</label>
        <input name="Areas of Interest" type="checkbox" value="Web Development"/>

        <br />

        <label>Cloud</label>
        <input name="Areas of Interest" type="checkbox" value="Cloud" />
        <br />

        <label>Cyber Security</label>
        <input
          name="Areas of Interest"
          type="checkbox"
          value="Cyber Security"
        />
        <br />

        <label>Data Science</label>
        <input name="Areas of Interest" type="checkbox" value="Data Science" />
        <br />

        <h3 id="a">Workshop Selection</h3>
        <br />
        <label>Select Workshop </label>
        <input type="text" placeholder="React Advanced Patterns" />
      </fieldset>
      

      <fieldset>
        <h3 id="a">Additional Information</h3>
        <label>Why do you want to attend this conference?</label>
        <br />
        <textarea
          name="answer"
          placeholder="Write your answer here..."
        ></textarea>
        <br />
        <label>I agree to the terms and conditions </label>
        <input type="checkbox" />
        <br />
        <br />
        <button>Submit Registration</button>
      </fieldset>
    </center>
  </body>
</html>
